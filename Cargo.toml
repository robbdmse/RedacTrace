[package]
name = "redactrace"
version = "0.1.0"
edition = "2021"
description = "RedacTrace: redact subscriber and network identities from S1-MME (S1AP) and N2 (NGAP) pcap/pcapng traces"
readme = "README.md"

[[bin]]
name = "redactrace"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# no "color" feature: it pulls in windows-sys, which needs a 64-bit dlltool on windows-gnu
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
getrandom = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
